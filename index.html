<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onederz · Guest Complaint</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #16323A;
    --teal: #1F6F6B;
    --teal-dark: #164F4C;
    --sand: #F3ECDC;
    --paper: #FFFFFF;
    --amber: #C98A28;
    --amber-bg: #FBEED9;
    --coral: #B3402F;
    --coral-bg: #F8E2DD;
    --sage: #4C7A54;
    --sage-bg: #E3EEE2;
    --slate: #6E7C7A;
    --line: #DED2B8;
    --font-head: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--sand);
    min-height: 100vh;
    padding: 0 0 60px 0;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 960px; margin: 0 auto; padding: 36px 24px 0; }

  .masthead {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
    border-bottom: 2px solid var(--ink); padding-bottom: 18px;
  }
  .wordmark { font-family: var(--font-head); font-weight: 600; font-size: 34px; letter-spacing: -0.01em; margin: 0; }
  .wordmark span { color: var(--teal); }
  .tagline { font-size: 13px; color: var(--slate); margin: 0; }

  .conn-strip { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--slate); margin: 12px 0 22px; }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--slate); flex-shrink: 0; }
  .conn-dot.on { background: var(--sage); }
  .conn-dot.off { background: var(--amber); }

  .tabs { display: flex; gap: 0; margin-bottom: 32px; }
  .tab {
    flex: 1; text-align: center; padding: 14px 10px; cursor: pointer;
    font-family: var(--font-head); font-size: 16px; font-weight: 500;
    background: var(--paper); border: 1px dashed var(--line); border-bottom: none;
    color: var(--slate); transition: background .15s, color .15s; user-select: none;
  }
  .tab:not(:last-child) { border-right: none; }
  .tab.active { background: var(--teal); color: #fff; border-color: var(--teal); }

  .panel { background: var(--paper); border: 1px solid var(--line); padding: 32px; }

  .section-title {
    font-family: var(--font-head); font-size: 19px; font-weight: 600;
    margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .section-title:not(:first-child) { margin-top: 32px; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }

  label { font-size: 12.5px; color: var(--slate); font-weight: 600; }

  input[type=text], input[type=date], input[type=url], select, textarea {
    font-family: var(--font-body); font-size: 14.5px; padding: 9px 10px;
    border: 1px solid var(--line); background: #FCFAF4; color: var(--ink);
    outline: none; border-radius: 2px; width: 100%;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--teal); background: #fff; }
  textarea { resize: vertical; min-height: 64px; }

  .status-choices { display: flex; gap: 10px; flex-wrap: wrap; }
  .status-pill {
    padding: 8px 16px; border: 1px solid var(--line); cursor: pointer;
    font-size: 13.5px; background: #FCFAF4; user-select: none;
  }
  .status-pill.selected[data-status="Solved"] { background: var(--sage); border-color: var(--sage); color: #fff; }
  .status-pill.selected[data-status="In Progress"] { background: var(--amber); border-color: var(--amber); color: #fff; }
  .status-pill.selected[data-status="Not Yet Solved"] { background: var(--slate); border-color: var(--slate); color: #fff; }
  .status-pill.selected[data-status="Need GM Support"] { background: var(--coral); border-color: var(--coral); color: #fff; }

  .submit-row { display: flex; align-items: center; gap: 14px; margin-top: 28px; flex-wrap: wrap; }
  .btn-primary {
    background: var(--teal); color: #fff; border: none; padding: 12px 26px;
    font-size: 14.5px; font-weight: 600; cursor: pointer; font-family: var(--font-body);
  }
  .btn-primary:hover { background: var(--teal-dark); }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .btn-secondary {
    background: transparent; color: var(--slate); border: 1px solid var(--line);
    padding: 11px 20px; font-size: 14px; cursor: pointer; font-family: var(--font-body); white-space: nowrap;
  }
  .btn-secondary:hover { border-color: var(--teal); color: var(--teal-dark); }
  .form-msg { font-size: 13.5px; color: var(--teal-dark); font-weight: 600; }

  .log-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .log-controls input, .log-controls select { min-width: 140px; width: auto; }
  .log-table-wrap { overflow-x: auto; border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
  thead th {
    text-align: left; font-weight: 600; font-size: 11.5px; color: var(--slate);
    background: #FCFAF4; padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  tbody td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:hover { background: #FBF8EF; }
  .badge { display: inline-block; padding: 3px 9px; font-size: 11.5px; font-weight: 600; border-radius: 2px; white-space: nowrap; }
  .badge.NeedGMSupport { background: var(--coral-bg); color: var(--coral); }
  .status-select { font-size: 12px; padding: 4px 6px; border: 1px solid var(--line); background: #fff; width: auto; }
  .icon-btn { background: none; border: none; cursor: pointer; color: var(--slate); font-size: 15px; padding: 2px 6px; }
  .icon-btn:hover { color: var(--coral); }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--slate); }
  .empty-state .big { font-family: var(--font-head); font-size: 20px; color: var(--ink); margin-bottom: 6px; }
  .detail-text { max-width: 240px; white-space: normal; }
  .row-count { font-size: 12.5px; color: var(--slate); margin-bottom: 6px; min-height: 16px; }

  .stat-strip {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line); margin-bottom: 32px;
  }
  .stat-box { background: var(--paper); padding: 20px 18px; }
  .stat-num { font-family: var(--font-head); font-size: 36px; font-weight: 600; line-height: 1; }
  .stat-label { font-size: 12.5px; color: var(--slate); margin-top: 8px; }
  .stat-box.solved .stat-num { color: var(--sage); }
  .stat-box.progress .stat-num { color: var(--amber); }
  .stat-box.gm .stat-num { color: var(--coral); }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .chart-col .section-title { margin-top: 0; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-label { width: 110px; font-size: 12.5px; flex-shrink: 0; }
  .bar-track { flex: 1; background: #EFEBE0; height: 16px; }
  .bar-fill { height: 100%; background: var(--teal); }
  .bar-val { width: 24px; font-size: 12.5px; text-align: right; color: var(--slate); flex-shrink: 0; }

  @media (max-width: 720px) {
    .field-row { grid-template-columns: 1fr; }
    .stat-strip { grid-template-columns: 1fr 1fr; }
    .chart-grid { grid-template-columns: 1fr; }
    .tab { font-size: 12.5px; padding: 12px 4px; }
    .panel { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div id="onz-root"></div>

<script>
(function () {
  // ================================================================
  //  ⚙️  PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
  // ================================================================
  const SHEETS_URL = "https://script.google.com/macros/s/AKfycbwv3IPYp2Blan3aGkI596zffjO3GuufCXvJ63NnkpauOaaWpYCKrYaxqyzxqnzHd88f/exec";
  // ================================================================

  const DEPARTMENTS = ["Reception", "Housekeeping", "Maintenance", "Kitchen / F&B", "Bar", "Activities", "Other"];
  const STATUSES = ["Solved", "In Progress", "Not Yet Solved", "Need GM Support"];
  const YESNO = ["Pending", "Yes", "No"];
  const FIELDS = ["id","reportNo","date","department","title","guestName","roomNumber","teamMember",
                  "problem","story","actionTaken","followUp","status","needGMSupport",
                  "responsiblePerson","guestSatisfied","remarks","createdAt"];

  let complaints = [];
  let loaded = false;
  let activeTab = 'form';
  let logFilters = { department: '', status: '', search: '' };
  let pendingStatusPill = 'Not Yet Solved';
  let connError = '';

  const root = document.getElementById('onz-root');

  // ---------- helpers ----------
  function loadFonts() {
    try {
      if (document.getElementById('onz-fonts')) return;
      const link = document.createElement('link');
      link.id = 'onz-fonts';
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap';
      document.head.appendChild(link);
    } catch (e) {}
  }

  function todayISO() {
    try { return new Date().toISOString().slice(0, 10); }
    catch (e) { return ''; }
  }

  function genReportNo() {
    try {
      const d = new Date();
      const ymd = d.getFullYear().toString()
        + String(d.getMonth() + 1).padStart(2, '0')
        + String(d.getDate()).padStart(2, '0');
      const rand = Math.random().toString(36).slice(2, 6).toUpperCase();
      return 'ONZ-' + ymd + '-' + rand;
    } catch (e) { return 'ONZ-' + Date.now(); }
  }

  function escapeHtml(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function normalizeRecord(r) {
    const rec = {};
    FIELDS.forEach(f => rec[f] = r[f] !== undefined && r[f] !== null ? String(r[f]) : '');
    return rec;
  }

  function isConfigured() {
    return SHEETS_URL && SHEETS_URL.indexOf('http') === 0 && SHEETS_URL.indexOf('PASTE_') === -1;
  }

  // ---------- data layer (Sheets only) ----------
  async function fetchAllComplaints() {
    connError = '';
    if (!isConfigured()) {
      connError = 'The Google Sheet URL is not set. Open index.html and replace SHEETS_URL with your Web App URL.';
      complaints = [];
      return;
    }
    try {
      const sep = SHEETS_URL.includes('?') ? '&' : '?';
      const res = await fetch(SHEETS_URL + sep + '_=' + Date.now(), { method: 'GET' });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Sheet returned an error');
      complaints = (json.complaints || []).map(normalizeRecord).reverse();
    } catch (err) {
      connError = err.message || String(err);
      // keep previous complaints on failure so the table doesn't blank out
    }
  }

  async function sheetsPost(payload) {
    if (!isConfigured()) throw new Error('Google Sheet URL not configured.');
    const res = await fetch(SHEETS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Sheet write failed');
    return json;
  }

  async function addComplaint(record) {
    complaints.unshift(record);
    await sheetsPost({ action: 'add', record });
  }

  async function updateComplaint(record) {
    const idx = complaints.findIndex(c => c.id === record.id);
    if (idx > -1) complaints[idx] = record;
    await sheetsPost({ action: 'update', record });
  }

  async function deleteComplaint(id) {
    complaints = complaints.filter(c => c.id !== id);
    await sheetsPost({ action: 'delete', id });
  }

  // ---------- FORM ----------
  function renderFormPanel() {
    return `
      <div class="panel">
        <form id="onz-form">
          <div class="section-title">1 · Report Details</div>
          <div class="field-row">
            <div class="field">
              <label>Department</label>
              <select name="department">
                <option value="" selected>Select department</option>
                ${DEPARTMENTS.map(d => `<option value="${d}">${d}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label>Date</label>
              <input type="date" name="date" value="${todayISO()}">
            </div>
          </div>
          <div class="field-row">
            <div class="field full">
              <label>Title</label>
              <input type="text" name="title" placeholder="Short summary, e.g. AC not cooling in Room 214">
            </div>
          </div>

          <div class="section-title">2 · Guest / Team Information</div>
          <div class="field-row">
            <div class="field"><label>Guest name</label><input type="text" name="guestName" placeholder="Guest name"></div>
            <div class="field"><label>Room number</label><input type="text" name="roomNumber" placeholder="e.g. 214"></div>
          </div>
          <div class="field-row">
            <div class="field full"><label>Team member (reporting)</label><input type="text" name="teamMember" placeholder="Your name"></div>
          </div>

          <div class="section-title">3 · Problem / Complaint</div>
          <div class="field-row"><div class="field full"><textarea name="problem" placeholder="What went wrong?"></textarea></div></div>

          <div class="section-title">4 · Story / Details</div>
          <div class="field-row"><div class="field full"><textarea name="story" placeholder="Full account of what happened"></textarea></div></div>

          <div class="section-title">5 · Action Taken / How It Was Solved</div>
          <div class="field-row"><div class="field full"><textarea name="actionTaken" placeholder="What was done in response"></textarea></div></div>

          <div class="section-title">6 · Follow-up / Next Action</div>
          <div class="field-row"><div class="field full"><textarea name="followUp" placeholder="Anything still outstanding"></textarea></div></div>

          <div class="section-title">7 · Status</div>
          <div class="status-choices" id="onz-status-choices">
            ${STATUSES.map(s => `<div class="status-pill ${s === pendingStatusPill ? 'selected' : ''}" data-status="${s}">${s}</div>`).join('')}
          </div>

          <div class="section-title">8 · Wrap-up</div>
          <div class="field-row">
            <div class="field"><label>Responsible person</label><input type="text" name="responsiblePerson" placeholder="Who owns this"></div>
            <div class="field"><label>Guest satisfied?</label>
              <select name="guestSatisfied">${YESNO.map(o => `<option value="${o}">${o}</option>`).join('')}</select>
            </div>
          </div>
          <div class="field-row"><div class="field full"><label>Remarks</label><input type="text" name="remarks" placeholder="Optional notes"></div></div>

          <div class="submit-row">
            <button type="submit" class="btn-primary" id="onz-submit-btn">Submit complaint</button>
            <button type="button" class="btn-secondary" id="onz-clear-btn">Clear form</button>
            <span class="form-msg" id="onz-form-msg"></span>
          </div>
        </form>
      </div>
    `;
  }

  function wireFormPanel() {
    const form = document.getElementById('onz-form');
    if (!form) return;

    const statusChoices = document.getElementById('onz-status-choices');
    if (statusChoices) statusChoices.addEventListener('click', (e) => {
      const pill = e.target.closest('.status-pill');
      if (!pill) return;
      pendingStatusPill = pill.dataset.status;
      document.querySelectorAll('#onz-status-choices .status-pill').forEach(p => p.classList.remove('selected'));
      pill.classList.add('selected');
    });

    const clearBtn = document.getElementById('onz-clear-btn');
    if (clearBtn) clearBtn.addEventListener('click', () => {
      pendingStatusPill = 'Not Yet Solved';
      render();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('onz-form-msg');
      const btn = document.getElementById('onz-submit-btn');
      const fd = new FormData(form);

      const missing = [];
      if (!fd.get('department')) missing.push('Department');
      if (!fd.get('title') || !fd.get('title').trim()) missing.push('Title');
      if (!fd.get('problem') || !fd.get('problem').trim()) missing.push('Problem / Complaint');
      if (missing.length) {
        msg.style.color = 'var(--coral)';
        msg.textContent = 'Please fill in: ' + missing.join(', ');
        return;
      }

      const record = {
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        reportNo: genReportNo(),
        date: fd.get('date') || todayISO(),
        department: fd.get('department'),
        title: fd.get('title'),
        guestName: fd.get('guestName') || '',
        roomNumber: fd.get('roomNumber') || '',
        teamMember: fd.get('teamMember') || '',
        problem: fd.get('problem') || '',
        story: fd.get('story') || '',
        actionTaken: fd.get('actionTaken') || '',
        followUp: fd.get('followUp') || '',
        status: pendingStatusPill,
        needGMSupport: pendingStatusPill === 'Need GM Support' ? 'Yes' : 'No',
        responsiblePerson: fd.get('responsiblePerson') || '',
        guestSatisfied: fd.get('guestSatisfied') || 'Pending',
        remarks: fd.get('remarks') || '',
        createdAt: new Date().toISOString()
      };

      btn.disabled = true;
      msg.style.color = 'var(--teal-dark)';
      msg.textContent = 'Saving…';
      try {
        await addComplaint(record);
        pendingStatusPill = 'Not Yet Solved';
        msg.textContent = 'Saved ' + record.reportNo + ' ✓';
        form.reset();
      } catch (err) {
        msg.style.color = 'var(--coral)';
        msg.textContent = 'Could not save: ' + err.message;
      }
      btn.disabled = false;
      render();
    });
  }

  // ---------- LOG ----------
  function filteredComplaints() {
    return complaints.filter(c => {
      if (logFilters.department && c.department !== logFilters.department) return false;
      if (logFilters.status && c.status !== logFilters.status) return false;
      if (logFilters.search) {
        const q = logFilters.search.toLowerCase();
        const hay = [c.title, c.guestName, c.roomNumber, c.reportNo, c.teamMember].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function renderLogPanel() {
    const rows = filteredComplaints();
    return `
      <div class="panel">
        ${connError ? `<div class="row-count" style="color:var(--coral)">${escapeHtml(connError)}</div>` : ''}
        <div class="log-controls">
          <input type="text" id="onz-search" placeholder="Search title, guest, room, report no…" value="${escapeHtml(logFilters.search)}">
          <select id="onz-filter-dept">
            <option value="">All departments</option>
            ${DEPARTMENTS.map(d => `<option value="${d}" ${logFilters.department === d ? 'selected' : ''}>${d}</option>`).join('')}
          </select>
          <select id="onz-filter-status">
            <option value="">All statuses</option>
            ${STATUSES.map(s => `<option value="${s}" ${logFilters.status === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
          <button type="button" class="btn-secondary" id="onz-refresh-btn">↻ Refresh</button>
        </div>
        <div class="row-count">${rows.length} of ${complaints.length} complaint${complaints.length === 1 ? '' : 's'}</div>
        <div class="row-count" id="onz-io-msg"></div>
        ${rows.length === 0 ? `
          <div class="empty-state">
            <div class="big">No complaints here</div>
            <div>${complaints.length === 0 ? 'Once a complaint is submitted, it will show up in this log.' : 'Try adjusting your filters.'}</div>
          </div>
        ` : `
        <div class="log-table-wrap">
          <table>
            <thead><tr>
              <th>Report No.</th><th>Date</th><th>Department</th><th>Title</th>
              <th>Guest / Room</th><th>Problem</th><th>Status</th><th>GM?</th><th>Satisfied</th><th></th>
            </tr></thead>
            <tbody>
              ${rows.map(c => `
                <tr data-id="${c.id}">
                  <td><strong>${escapeHtml(c.reportNo)}</strong></td>
                  <td>${escapeHtml(c.date)}</td>
                  <td>${escapeHtml(c.department)}</td>
                  <td class="detail-text">${escapeHtml(c.title)}</td>
                  <td>${escapeHtml(c.guestName)}${c.roomNumber ? ' · ' + escapeHtml(c.roomNumber) : ''}</td>
                  <td class="detail-text">${escapeHtml(c.problem)}</td>
                  <td>
                    <select class="status-select" data-id="${c.id}">
                      ${STATUSES.map(s => `<option value="${s}" ${c.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>
                  </td>
                  <td><span class="badge ${c.needGMSupport === 'Yes' ? 'NeedGMSupport' : ''}">${escapeHtml(c.needGMSupport)}</span></td>
                  <td>${escapeHtml(c.guestSatisfied)}</td>
                  <td><button class="icon-btn" data-del="${c.id}" title="Delete">✕</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        `}
      </div>
    `;
  }

  function wireLogPanel() {
    const search = document.getElementById('onz-search');
    const fdept = document.getElementById('onz-filter-dept');
    const fstat = document.getElementById('onz-filter-status');

    // Debounced search
    let searchTimer = null;
    if (search) search.addEventListener('input', (e) => {
      const val = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        logFilters.search = val;
        rerenderLogOnly();
        const newSearch = document.getElementById('onz-search');
        if (newSearch) { newSearch.focus(); newSearch.setSelectionRange(val.length, val.length); }
      }, 200);
    });

    if (fdept) fdept.addEventListener('change', (e) => { logFilters.department = e.target.value; rerenderLogOnly(); });
    if (fstat) fstat.addEventListener('change', (e) => { logFilters.status = e.target.value; rerenderLogOnly(); });

    document.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', async (e) => {
        const id = e.target.dataset.id;
        const rec = complaints.find(c => c.id === id);
        if (!rec) return;
        const updated = Object.assign({}, rec, {
          status: e.target.value,
          needGMSupport: e.target.value === 'Need GM Support' ? 'Yes' : 'No'
        });
        const ioMsg = document.getElementById('onz-io-msg');
        try {
          await updateComplaint(updated);
        } catch (err) {
          if (ioMsg) { ioMsg.style.color = 'var(--coral)'; ioMsg.textContent = 'Could not update status: ' + err.message; }
        }
        rerenderLogOnly();
      });
    });

    document.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.dataset.del;
        if (!confirm('Delete this complaint record? This cannot be undone.')) return;
        try {
          await deleteComplaint(id);
        } catch (err) {
          const ioMsg = document.getElementById('onz-io-msg');
          if (ioMsg) { ioMsg.style.color = 'var(--coral)'; ioMsg.textContent = 'Could not delete: ' + err.message; }
        }
        rerenderLogOnly();
      });
    });

    const refreshBtn = document.getElementById('onz-refresh-btn');
    if (refreshBtn) refreshBtn.addEventListener('click', async () => {
      const ioMsg = document.getElementById('onz-io-msg');
      if (ioMsg) { ioMsg.style.color = 'var(--slate)'; ioMsg.textContent = 'Refreshing…'; }
      await fetchAllComplaints();
      rerenderLogOnly();
    });
  }

  function rerenderLogOnly() {
    const container = document.getElementById('onz-panel-container');
    if (container) {
      container.innerHTML = renderLogPanel();
      wireLogPanel();
    }
  }

  // ---------- DASHBOARD ----------
  function renderDashboardPanel() {
    const total = complaints.length;
    const countBy = (pred) => complaints.filter(pred).length;
    const solved = countBy(c => c.status === 'Solved');
    const progress = countBy(c => c.status === 'In Progress');
    const gm = countBy(c => c.needGMSupport === 'Yes');

    const byDept = {}; DEPARTMENTS.forEach(d => byDept[d] = 0);
    complaints.forEach(c => { byDept[c.department] = (byDept[c.department] || 0) + 1; });
    const maxDept = Math.max(1, ...Object.values(byDept));

    const byStatus = {}; STATUSES.forEach(s => byStatus[s] = 0);
    complaints.forEach(c => { byStatus[c.status] = (byStatus[c.status] || 0) + 1; });
    const maxStatus = Math.max(1, ...Object.values(byStatus));

    return `
      <div class="panel">
        ${connError ? `<div class="row-count" style="color:var(--coral)">${escapeHtml(connError)}</div>` : ''}
        <div class="stat-strip">
          <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-label">Total complaints</div></div>
          <div class="stat-box solved"><div class="stat-num">${solved}</div><div class="stat-label">Solved</div></div>
          <div class="stat-box progress"><div class="stat-num">${progress}</div><div class="stat-label">In progress</div></div>
          <div class="stat-box gm"><div class="stat-num">${gm}</div><div class="stat-label">Need GM support</div></div>
        </div>
        <div class="chart-grid">
          <div class="chart-col">
            <div class="section-title">Complaints by Department</div>
            ${DEPARTMENTS.map(d => `
              <div class="bar-row"><div class="bar-label">${d}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${(byDept[d] / maxDept * 100).toFixed(0)}%"></div></div>
                <div class="bar-val">${byDept[d]}</div></div>
            `).join('')}
          </div>
          <div class="chart-col">
            <div class="section-title">Complaints by Status</div>
            ${STATUSES.map(s => `
              <div class="bar-row"><div class="bar-label">${s}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${(byStatus[s] / maxStatus * 100).toFixed(0)}%; background:${
                  s === 'Solved' ? 'var(--sage)' : s === 'In Progress' ? 'var(--amber)' : s === 'Need GM Support' ? 'var(--coral)' : 'var(--slate)'
                }"></div></div>
                <div class="bar-val">${byStatus[s]}</div></div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }

  // ---------- SHELL ----------
  function render() {
    if (!loaded) {
      root.innerHTML = `<div class="wrap"><div class="panel" style="text-align:center; color: var(--slate);">Loading complaint database…</div></div>`;
      return;
    }
    const tabs = [
      { id: 'form', label: 'New Complaint' },
      { id: 'log', label: 'Complaint Log' },
      { id: 'dashboard', label: 'Dashboard' }
    ];
    let panelHtml = '';
    if (activeTab === 'form') panelHtml = renderFormPanel();
    else if (activeTab === 'log') panelHtml = renderLogPanel();
    else panelHtml = renderDashboardPanel();

    const dotClass = !isConfigured() ? 'off' : (connError ? 'off' : 'on');
    const stripText = !isConfigured()
      ? 'Google Sheet URL not configured — edit index.html'
      : (connError ? 'Google Sheet connection issue — click Refresh' : 'Synced to Google Sheet');

    root.innerHTML = `
      <div class="wrap">
        <div class="masthead">
          <div><p class="wordmark">Onederz<span>.</span></p><p class="tagline">Guest Complaint &amp; Feedback Report</p></div>
          <p class="tagline">${todayISO()}</p>
        </div>
        <div class="conn-strip">
          <div class="conn-dot ${dotClass}"></div>
          <span>${stripText}</span>
        </div>
        <div class="tabs">
          ${tabs.map(t => `<div class="tab ${activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">${t.label}</div>`).join('')}
        </div>
        <div id="onz-panel-container">${panelHtml}</div>
      </div>
    `;

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        activeTab = tab.dataset.tab;
        render();
      });
    });

    if (activeTab === 'form') wireFormPanel();
    else if (activeTab === 'log') wireLogPanel();
  }

  // ---------- INIT ----------
  async function init() {
    try { loadFonts(); } catch (e) {}
    render();
    try { await fetchAllComplaints(); } catch (e) { complaints = []; }
    loaded = true;
    render();
  }

  init().catch((err) => {
    console.error('Init failed:', err);
    loaded = true;
    complaints = [];
    render();
  });
})();
</script>
</body>
</html>
