<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F6F6B">
<title>Onederz · Guest Complaint</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --ink: #16323A;
    --teal: #1F6F6B;
    --teal-dark: #164F4C;
    --sand: #F3ECDC;
    --paper: #FFFFFF;
    --amber: #C98A28;
    --amber-bg: #FBEED9;
    --coral: #B3402F;
    --coral-bg: #F8E2DD;
    --sage: #4C7A54;
    --sage-bg: #E3EEE2;
    --slate: #6E7C7A;
    --line: #DED2B8;
    --font-head: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--sand);
    min-height: 100vh;
    padding: 0 0 env(safe-area-inset-bottom, 0) 0;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 16px 90px;
  }
  @media (min-width: 720px) {
    .wrap { padding: 36px 24px 60px; }
  }

  /* ---- Sticky mobile header ---- */
  .mobile-head {
    position: sticky; top: 0; z-index: 40;
    background: var(--sand);
    padding: 14px 0 10px;
    margin: 0 -16px;
    padding-left: 16px; padding-right: 16px;
    border-bottom: 1px solid var(--line);
    backdrop-filter: saturate(140%) blur(6px);
  }
  @media (min-width: 720px) {
    .mobile-head {
      position: static;
      margin: 0; padding: 0;
      border-bottom: none;
      background: transparent;
      backdrop-filter: none;
    }
  }

  .masthead {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 4px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--ink);
  }
  @media (min-width: 720px) {
    .masthead { margin-bottom: 10px; padding-bottom: 18px; }
  }

  .wordmark {
    font-family: var(--font-head); font-weight: 600;
    font-size: 26px; letter-spacing: -0.01em; margin: 0; line-height: 1;
  }
  @media (min-width: 720px) { .wordmark { font-size: 34px; } }
  .wordmark span { color: var(--teal); }

  .tagline { font-size: 12px; color: var(--slate); margin: 0; }
  @media (min-width: 720px) { .tagline { font-size: 13px; } }
  .tagline.date { font-size: 11px; }

  /* ---- Connection strip ---- */
  .conn-strip {
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; color: var(--slate);
    margin: 10px 0 14px;
  }
  @media (min-width: 720px) { .conn-strip { margin: 12px 0 22px; font-size: 12px; } }

  .conn-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--slate); flex-shrink: 0;
  }
  .conn-dot.on { background: var(--sage); box-shadow: 0 0 0 3px rgba(76,122,84,0.15); }
  .conn-dot.off { background: var(--amber); box-shadow: 0 0 0 3px rgba(201,138,40,0.15); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex; gap: 8px;
    margin-bottom: 18px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 1 0 auto;
    text-align: center;
    padding: 12px 14px;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 13px; font-weight: 600;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--slate);
    transition: background .15s, color .15s, border-color .15s, transform .1s;
    user-select: none;
    white-space: nowrap;
  }
  .tab:active { transform: scale(0.97); }
  .tab.active {
    background: var(--teal); color: #fff; border-color: var(--teal);
    box-shadow: 0 3px 10px rgba(31,111,107,0.25);
  }

  @media (min-width: 720px) {
    .tabs { gap: 0; overflow: visible; margin-bottom: 32px; }
    .tab {
      flex: 1; padding: 14px 10px;
      font-family: var(--font-head);
      font-size: 16px; font-weight: 500;
      border-radius: 0;
      background: var(--paper);
      border: 1px dashed var(--line);
      border-bottom: none;
      box-shadow: none;
    }
    .tab:not(:last-child) { border-right: none; }
    .tab.active { box-shadow: none; }
  }

  /* ---- Panel ---- */
  .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 16px;
    box-shadow: 0 1px 2px rgba(22,50,58,0.04);
  }
  @media (min-width: 720px) {
    .panel { border-radius: 0; padding: 32px; box-shadow: none; }
  }

  /* ---- Section titles ---- */
  .section-title {
    font-family: var(--font-head);
    font-size: 16px; font-weight: 600;
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  .section-title:not(:first-child) { margin-top: 26px; }
  @media (min-width: 720px) {
    .section-title { font-size: 19px; margin-bottom: 14px; }
    .section-title:not(:first-child) { margin-top: 32px; }
  }

  .section-title::before {
    content: attr(data-num);
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--teal); color: #fff;
    font-family: var(--font-body); font-size: 11px; font-weight: 700;
    flex-shrink: 0;
  }

  /* ---- Fields ---- */
  .field-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }
  @media (min-width: 560px) {
    .field-row { grid-template-columns: 1fr 1fr; gap: 16px; }
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 12.5px; color: var(--slate); font-weight: 600;
    letter-spacing: 0.01em;
  }

  input[type=text], input[type=date], input[type=url], select, textarea {
    font-family: var(--font-body);
    font-size: 16px;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    background: #FCFAF4;
    color: var(--ink);
    outline: none;
    border-radius: 10px;
    width: 100%;
    transition: border-color .15s, background .15s, box-shadow .15s;
    -webkit-appearance: none;
    appearance: none;
  }
  @media (min-width: 720px) {
    input[type=text], input[type=date], input[type=url], select, textarea {
      font-size: 14.5px; padding: 10px 12px; border-radius: 4px;
    }
  }

  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%236E7C7A' d='M6 8 0 0h12z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--teal);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(31,111,107,0.10);
  }

  textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

  /* ---- Status pills ---- */
  .status-choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  @media (min-width: 560px) {
    .status-choices { display: flex; flex-wrap: wrap; gap: 10px; }
  }

  .status-pill {
    padding: 14px 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    font-size: 13.5px; font-weight: 600;
    background: #FCFAF4;
    user-select: none;
    text-align: center;
    transition: transform .1s, background .15s, border-color .15s, color .15s;
  }
  .status-pill:active { transform: scale(0.97); }

  @media (min-width: 560px) {
    .status-pill { padding: 9px 16px; border-radius: 4px; font-weight: 500; }
  }

  .status-pill.selected[data-status="Solved"] { background: var(--sage); border-color: var(--sage); color: #fff; }
  .status-pill.selected[data-status="In Progress"] { background: var(--amber); border-color: var(--amber); color: #fff; }
  .status-pill.selected[data-status="Not Yet Solved"] { background: var(--slate); border-color: var(--slate); color: #fff; }
  .status-pill.selected[data-status="Need GM Support"] { background: var(--coral); border-color: var(--coral); color: #fff; }

  /* ---- Buttons ---- */
  .submit-row {
    display: flex; flex-direction: column;
    gap: 10px; margin-top: 24px;
  }
  @media (min-width: 560px) {
    .submit-row { flex-direction: row; align-items: center; gap: 14px; flex-wrap: wrap; }
  }

  .btn-primary {
    background: var(--teal); color: #fff; border: none;
    padding: 15px 26px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: var(--font-body);
    border-radius: 10px;
    transition: background .15s, transform .1s, box-shadow .15s;
    box-shadow: 0 3px 12px rgba(31,111,107,0.25);
    width: 100%;
  }
  @media (min-width: 560px) {
    .btn-primary { width: auto; border-radius: 4px; padding: 12px 26px; font-size: 14.5px; box-shadow: none; }
  }
  .btn-primary:hover { background: var(--teal-dark); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: .55; cursor: default; }

  .btn-secondary {
    background: transparent; color: var(--slate);
    border: 1.5px solid var(--line);
    padding: 13px 20px;
    font-size: 14px; cursor: pointer;
    font-family: var(--font-body); white-space: nowrap;
    border-radius: 10px;
    transition: border-color .15s, color .15s, transform .1s;
    width: 100%;
  }
  @media (min-width: 560px) {
    .btn-secondary { width: auto; border-radius: 4px; padding: 11px 20px; }
  }
  .btn-secondary:hover { border-color: var(--teal); color: var(--teal-dark); }
  .btn-secondary:active { transform: scale(0.98); }

  .form-msg { font-size: 13.5px; color: var(--teal-dark); font-weight: 600; text-align: center; }
  @media (min-width: 560px) { .form-msg { text-align: left; } }

  /* ---- Log controls ---- */
  .log-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .log-controls input { grid-column: 1 / -1; }
  @media (min-width: 720px) {
    .log-controls {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 10px; margin-bottom: 20px;
    }
    .log-controls input { grid-column: auto; }
  }

  .log-controls input,
  .log-controls select {
    width: 100%;
    min-width: 0;
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 10px;
  }
  @media (min-width: 720px) {
    .log-controls input { min-width: 220px; width: auto; font-size: 14px; padding: 9px 10px; border-radius: 4px; }
    .log-controls select { min-width: 150px; width: auto; font-size: 14px; padding: 9px 10px; border-radius: 4px; }
    .log-controls button { grid-column: auto; }
  }

  .log-controls button { grid-column: 1 / -1; }
  @media (min-width: 560px) {
    .log-controls button { grid-column: auto; }
  }

  .row-count { font-size: 12.5px; color: var(--slate); margin-bottom: 8px; min-height: 16px; }

  /* ---- Desktop TABLE ---- */
  .log-table-wrap {
    display: none;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  @media (min-width: 900px) {
    .log-table-wrap { display: block; border-radius: 0; }
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 960px; }
  thead th {
    text-align: left; font-weight: 600; font-size: 11.5px;
    color: var(--slate); background: #FCFAF4;
    padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  tbody td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:hover { background: #FBF8EF; }
  .detail-text { max-width: 240px; white-space: normal; }

  .badge {
    display: inline-block; padding: 3px 9px; font-size: 11.5px;
    font-weight: 600; border-radius: 999px; white-space: nowrap;
    background: #EFEBE0; color: var(--slate);
  }
  .badge.NeedGMSupport { background: var(--coral-bg); color: var(--coral); }

  .status-select {
    font-size: 12px; padding: 5px 8px;
    border: 1px solid var(--line); background: #fff;
    width: auto; border-radius: 6px;
  }

  .icon-btn {
    background: none; border: none; cursor: pointer;
    color: var(--slate); font-size: 15px; padding: 4px 8px;
    border-radius: 6px;
  }
  .icon-btn:hover { color: var(--coral); background: var(--coral-bg); }

  /* ---- MOBILE CARD LIST ---- */
  .log-cards {
    display: flex; flex-direction: column; gap: 12px;
  }
  @media (min-width: 900px) {
    .log-cards { display: none; }
  }

  .log-card {
    background: #FCFAF4;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
    position: relative;
  }

  .log-card-top {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  }
  .log-card-report {
    font-family: var(--font-head);
    font-weight: 600; font-size: 14px; color: var(--ink);
    line-height: 1.2;
  }
  .log-card-date {
    font-size: 11.5px; color: var(--slate);
    white-space: nowrap;
  }

  .log-card-title {
    font-weight: 600; font-size: 14.5px;
    color: var(--ink);
    line-height: 1.35;
  }

  .log-card-meta {
    display: flex; flex-wrap: wrap; gap: 6px;
    font-size: 12px; color: var(--slate);
  }

  .log-card-meta span {
    display: inline-flex; align-items: center; gap: 4px;
    background: #F3ECDC; padding: 3px 8px; border-radius: 999px;
    font-weight: 500;
  }

  .log-card-problem {
    font-size: 13px; color: var(--ink);
    background: #fff; border-left: 3px solid var(--amber);
    padding: 8px 10px; border-radius: 4px;
    line-height: 1.45;
    word-break: break-word;
  }

  .log-card-photo {
    display: block; width: 100%;
    max-height: 240px; object-fit: cover;
    border-radius: 8px; border: 1px solid var(--line);
    background: #EFEBE0;
  }

  .log-card-actions {
    display: flex; align-items: center; gap: 8px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    flex-wrap: wrap;
  }

  .log-card-actions .status-select {
    flex: 1; min-width: 130px;
    font-size: 13px; padding: 8px 10px;
    border-radius: 8px;
  }

  .log-card-actions .icon-btn {
    width: 38px; height: 38px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line);
    background: #fff;
    font-size: 14px;
  }

  /* ---- Empty state ---- */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--slate);
  }
  .empty-state .big {
    font-family: var(--font-head); font-size: 19px;
    color: var(--ink); margin-bottom: 6px;
  }
  @media (min-width: 720px) { .empty-state { padding: 50px 20px; } }

  /* ---- Dashboard ---- */
  .stat-strip {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  @media (min-width: 720px) {
    .stat-strip { grid-template-columns: repeat(4, 1fr); border-radius: 0; margin-bottom: 32px; }
  }

  .stat-box { background: var(--paper); padding: 16px 14px; }
  @media (min-width: 720px) { .stat-box { padding: 20px 18px; } }

  .stat-num {
    font-family: var(--font-head); font-weight: 600;
    font-size: 30px; line-height: 1;
  }
  @media (min-width: 720px) { .stat-num { font-size: 36px; } }
  .stat-label { font-size: 12px; color: var(--slate); margin-top: 6px; }
  @media (min-width: 720px) { .stat-label { font-size: 12.5px; margin-top: 8px; } }

  .stat-box.solved .stat-num { color: var(--sage); }
  .stat-box.progress .stat-num { color: var(--amber); }
  .stat-box.gm .stat-num { color: var(--coral); }

  .chart-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 28px;
  }
  @media (min-width: 720px) {
    .chart-grid { grid-template-columns: 1fr 1fr; gap: 32px; }
  }
  .chart-col .section-title { margin-top: 0; }

  .bar-row {
    display: grid;
    grid-template-columns: 92px 1fr 28px;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  @media (min-width: 720px) {
    .bar-row { grid-template-columns: 110px 1fr 24px; gap: 10px; }
  }

  .bar-label { font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (min-width: 720px) { .bar-label { font-size: 12.5px; } }

  .bar-track { background: #EFEBE0; height: 14px; border-radius: 999px; overflow: hidden; }
  @media (min-width: 720px) { .bar-track { height: 16px; border-radius: 2px; } }

  .bar-fill { height: 100%; background: var(--teal); transition: width .4s ease; border-radius: 999px; }
  @media (min-width: 720px) { .bar-fill { border-radius: 2px; } }

  .bar-val { font-size: 12px; text-align: right; color: var(--slate); }

  /* ---- Photo uploader ---- */
  .photo-uploader { margin-top: 4px; }

  .photo-drop {
    border: 2px dashed var(--line);
    border-radius: 12px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    background: #FCFAF4;
  }
  .photo-drop:hover, .photo-drop.dragging { border-color: var(--teal); background: #fff; }
  .photo-drop-icon { font-size: 28px; margin-bottom: 6px; }
  .photo-drop-title { font-weight: 600; font-size: 14px; color: var(--ink); margin-bottom: 2px; }
  .photo-drop-hint { font-size: 12px; color: var(--slate); }

  .photo-preview {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    background: #fff;
  }
  .photo-preview img {
    width: 72px; height: 72px; object-fit: cover;
    border-radius: 8px; background: #F3ECDC; flex-shrink: 0;
  }
  .photo-preview-info { flex: 1; min-width: 0; }
  .photo-preview-name {
    font-size: 13px; font-weight: 600; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .photo-preview-size { font-size: 12px; color: var(--slate); margin-top: 2px; }

  .photo-progress {
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    background: #FCFAF4;
  }
  .photo-progress-bar {
    height: 6px; width: 40%;
    background: var(--teal);
    border-radius: 999px;
    animation: photo-progress 1.2s ease-in-out infinite;
  }
  @keyframes photo-progress {
    0%   { width: 15%; opacity: .6; }
    50%  { width: 75%; opacity: 1; }
    100% { width: 15%; opacity: .6; }
  }
  .photo-progress-text { font-size: 12px; color: var(--slate); margin-top: 6px; }

  .photo-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--teal); font-weight: 600;
    text-decoration: none;
    padding: 4px 10px; border-radius: 999px;
    background: var(--sage-bg);
  }
  .photo-link:hover { text-decoration: underline; }

  /* ---- Floating refresh on mobile ---- */
  .fab {
    display: none;
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0));
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--teal);
    color: #fff;
    border: none;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(31,111,107,0.35);
    z-index: 50;
    align-items: center; justify-content: center;
    transition: transform .15s, background .15s;
  }
  .fab:active { transform: scale(0.94); }
  .fab.spin { animation: fab-spin .8s linear infinite; }
  @keyframes fab-spin { to { transform: rotate(360deg); } }

  @media (max-width: 899px) {
    .fab.visible { display: inline-flex; }
  }
</style>
</head>

                  "problem","story","actionTaken","followUp","status","needGMSupport",
                  "responsiblePerson","guestSatisfied","remarks","createdAt","photoUrl"];

  const PHOTO_MAX_BYTES = 5 * 1024 * 1024; // 5 MB

  let complaints = [];
  let loaded = false;
  let activeTab = 'form';
  let logFilters = { department: '', status: '', search: '' };
  let pendingStatusPill = 'Not Yet Solved';
  let connError = '';

  // Photo state (module scope so form submit can read it)
  let pendingPhoto = null;

  const root = document.getElementById('onz-root');

  // ---------- helpers ----------
  function loadFonts() {
    try {
      if (document.getElementById('onz-fonts')) return;
      const link = document.createElement('link');
      link.id = 'onz-fonts';
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap';
      document.head.appendChild(link);
    } catch (e) {}
  }

  function todayISO() {
    try { return new Date().toISOString().slice(0, 10); }
    catch (e) { return ''; }
  }

  function genReportNo() {
    try {
      const d = new Date();
      const ymd = d.getFullYear().toString()
        + String(d.getMonth() + 1).padStart(2, '0')
        + String(d.getDate()).padStart(2, '0');
      const rand = Math.random().toString(36).slice(2, 6).toUpperCase();
      return 'ONZ-' + ymd + '-' + rand;
    } catch (e) { return 'ONZ-' + Date.now(); }
  }

  function escapeHtml(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function normalizeRecord(r) {
    const rec = {};
    FIELDS.forEach(f => rec[f] = r[f] !== undefined && r[f] !== null ? String(r[f]) : '');
    return rec;
  }

  function bytesLabel(b) {
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1024 / 1024).toFixed(2) + ' MB';
  }

  function isConfigured() {
    return SHEETS_URL && SHEETS_URL.indexOf('http') === 0 && SHEETS_URL.indexOf('PASTE_') === -1;
  }

  // ---------- data layer ----------
  async function fetchAllComplaints() {
    connError = '';
    if (!isConfigured()) {
      connError = 'The Google Sheet URL is not set.';
      complaints = [];
      return;
    }
    try {
      const sep = SHEETS_URL.includes('?') ? '&' : '?';
      const res = await fetch(SHEETS_URL + sep + '_=' + Date.now(), { method: 'GET' });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Sheet returned an error');
      complaints = (json.complaints || []).map(normalizeRecord).reverse();
    } catch (err) {
      connError = err.message || String(err);
    }
  }

  async function sheetsPost(payload) {
    if (!isConfigured()) throw new Error('Google Sheet URL not configured.');
    const res = await fetch(SHEETS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Sheet write failed');
    return json;
  }

  async function addComplaint(record) {
    complaints.unshift(record);
    await sheetsPost({ action: 'add', record });
  }

  async function updateComplaint(record) {
    const idx = complaints.findIndex(c => c.id === record.id);
    if (idx > -1) complaints[idx] = record;
    await sheetsPost({ action: 'update', record });
  }

  async function deleteComplaint(id) {
    complaints = complaints.filter(c => c.id !== id);
    await sheetsPost({ action: 'delete', id });
  }

  function resetPhotoState() {
    pendingPhoto = null;
    const input = document.getElementById('onz-photo-input');
    const preview = document.getElementById('onz-photo-preview');
    const drop = document.getElementById('onz-photo-drop');
    const prog = document.getElementById('onz-photo-progress');
    if (input) input.value = '';
    if (preview) preview.style.display = 'none';
    if (drop) drop.style.display = 'block';
    if (prog) prog.style.display = 'none';
  }

  function wirePhotoUploader() {
    const input = document.getElementById('onz-photo-input');
    const drop = document.getElementById('onz-photo-drop');
    const preview = document.getElementById('onz-photo-preview');
    const img = document.getElementById('onz-photo-img');
    const nameEl = document.getElementById('onz-photo-name');
    const sizeEl = document.getElementById('onz-photo-size');
    const removeBtn = document.getElementById('onz-photo-remove');

    if (!input || !drop) return;

    function handleFile(file) {
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('Please pick an image file.');
        return;
      }
      if (file.size > PHOTO_MAX_BYTES) {
        alert('Image is larger than ' + bytesLabel(PHOTO_MAX_BYTES) + '. Please choose a smaller photo.');
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        pendingPhoto = { file, dataUrl: ev.target.result };
        if (img) img.src = ev.target.result;
        if (nameEl) nameEl.textContent = file.name;
        if (sizeEl) sizeEl.textContent = bytesLabel(file.size);
        drop.style.display = 'none';
        preview.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    drop.addEventListener('click', () => input.click());
    input.addEventListener('change', (e) => handleFile(e.target.files[0]));

    if (removeBtn) removeBtn.addEventListener('click', resetPhotoState);

    ['dragenter', 'dragover'].forEach(ev =>
      drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('dragging'); }));
    ['dragleave', 'drop'].forEach(ev =>
      drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('dragging'); }));
    drop.addEventListener('drop', (e) => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) handleFile(f);
    });
  }

  function wireFormPanel() {
    const form = document.getElementById('onz-form');
    if (!form) return;

    const statusChoices = document.getElementById('onz-status-choices');
    if (statusChoices) statusChoices.addEventListener('click', (e) => {
      const pill = e.target.closest('.status-pill');
      if (!pill) return;
      pendingStatusPill = pill.dataset.status;
      document.querySelectorAll('#onz-status-choices .status-pill').forEach(p => p.classList.remove('selected'));
      pill.classList.add('selected');
    });

    const clearBtn = document.getElementById('onz-clear-btn');
    if (clearBtn) clearBtn.addEventListener('click', () => {
      pendingStatusPill = 'Not Yet Solved';
      resetPhotoState();
      render();
    });

    wirePhotoUploader();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('onz-form-msg');
      const btn = document.getElementById('onz-submit-btn');
      const prog = document.getElementById('onz-photo-progress');
      const fd = new FormData(form);

      const missing = [];
      if (!fd.get('department')) missing.push('Department');
      if (!fd.get('title') || !fd.get('title').trim()) missing.push('Title');
      if (!fd.get('problem') || !fd.get('problem').trim()) missing.push('Problem');
      if (missing.length) {
        msg.style.color = 'var(--coral)';
        msg.textContent = 'Please fill in: ' + missing.join(', ');
        return;
      }

      const record = {
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        reportNo: genReportNo(),
        date: fd.get('date') || todayISO(),
        department: fd.get('department'),
        title: fd.get('title'),
        guestName: fd.get('guestName') || '',
        roomNumber: fd.get('roomNumber') || '',
        teamMember: fd.get('teamMember') || '',
        problem: fd.get('problem') || '',
        story: fd.get('story') || '',
        actionTaken: fd.get('actionTaken') || '',
        followUp: fd.get('followUp') || '',
        status: pendingStatusPill,
        needGMSupport: pendingStatusPill === 'Need GM Support' ? 'Yes' : 'No',
        responsiblePerson: fd.get('responsiblePerson') || '',
        guestSatisfied: fd.get('guestSatisfied') || 'Pending',
        remarks: fd.get('remarks') || '',
        createdAt: new Date().toISOString(),
        photoUrl: ''
      };

      btn.disabled = true;
      msg.style.color = 'var(--teal-dark)';

      try {
        // 1) Upload photo first (if any)
        if (pendingPhoto && pendingPhoto.dataUrl) {
          msg.textContent = 'Uploading photo…';
          if (prog) prog.style.display = 'block';
          const up = await sheetsPost({
            action: 'uploadPhoto',
            dataUrl: pendingPhoto.dataUrl,
            reportNo: record.reportNo
          });
          if (prog) prog.style.display = 'none';
          record.photoUrl = up.url || '';
        }

        // 2) Save the row
        msg.textContent = 'Saving…';
        await addComplaint(record);
        pendingStatusPill = 'Not Yet Solved';
        resetPhotoState();
        msg.textContent = 'Saved ' + record.reportNo + ' ✓';
        form.reset();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        if (prog) prog.style.display = 'none';
        msg.style.color = 'var(--coral)';
        msg.textContent = 'Could not save: ' + err.message;
      }
      btn.disabled = false;
      render();
    });
  }

  // ---------- LOG ----------
  function filteredComplaints() {
    return complaints.filter(c => {
      if (logFilters.department && c.department !== logFilters.department) return false;
      if (logFilters.status && c.status !== logFilters.status) return false;
      if (logFilters.search) {
        const q = logFilters.search.toLowerCase();
        const hay = [c.title, c.guestName, c.roomNumber, c.reportNo, c.teamMember].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function wireLogPanel() {
    const search = document.getElementById('onz-search');
    const fdept = document.getElementById('onz-filter-dept');
    const fstat = document.getElementById('onz-filter-status');

    let searchTimer = null;
    if (search) search.addEventListener('input', (e) => {
      const val = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        logFilters.search = val;
        rerenderLogOnly();
        const newSearch = document.getElementById('onz-search');
        if (newSearch) { newSearch.focus(); newSearch.setSelectionRange(val.length, val.length); }
      }, 220);
    });

    if (fdept) fdept.addEventListener('change', (e) => { logFilters.department = e.target.value; rerenderLogOnly(); });
    if (fstat) fstat.addEventListener('change', (e) => { logFilters.status = e.target.value; rerenderLogOnly(); });

    document.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', async (e) => {
        const id = e.target.dataset.id;
        const rec = complaints.find(c => c.id === id);
        if (!rec) return;
        const updated = Object.assign({}, rec, {
          status: e.target.value,
          needGMSupport: e.target.value === 'Need GM Support' ? 'Yes' : 'No'
        });
        const ioMsg = document.getElementById('onz-io-msg');
        try {
          await updateComplaint(updated);
        } catch (err) {
          if (ioMsg) { ioMsg.style.color = 'var(--coral)'; ioMsg.textContent = 'Could not update status: ' + err.message; }
        }
        rerenderLogOnly();
      });
    });

    document.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.dataset.del;
        if (!confirm('Delete this complaint record? This cannot be undone.')) return;
        try {
          await deleteComplaint(id);
        } catch (err) {
          const ioMsg = document.getElementById('onz-io-msg');
          if (ioMsg) { ioMsg.style.color = 'var(--coral)'; ioMsg.textContent = 'Could not delete: ' + err.message; }
        }
        rerenderLogOnly();
      });
    });

    const refreshBtn = document.getElementById('onz-refresh-btn');
    if (refreshBtn) refreshBtn.addEventListener('click', doRefresh);
  }

  async function doRefresh() {
    const ioMsg = document.getElementById('onz-io-msg');
    if (ioMsg) { ioMsg.style.color = 'var(--slate)'; ioMsg.textContent = 'Refreshing…'; }
    const fab = document.getElementById('onz-fab');
    if (fab) fab.classList.add('spin');
    try {
      await fetchAllComplaints();
    } catch (e) {}
    if (fab) fab.classList.remove('spin');
    rerenderLogOnly();
  }

  function rerenderLogOnly() {
    const container = document.getElementById('onz-panel-container');
    if (container) {
      container.innerHTML = renderLogPanel();
      wireLogPanel();
      updateFab();
    }
  }

  // ---------- DASHBOARD ----------
  function renderDashboardPanel() {
    const total = complaints.length;
    const countBy = (pred) => complaints.filter(pred).length;
    const solved = countBy(c => c.status === 'Solved');
    const progress = countBy(c => c.status === 'In Progress');
    const gm = countBy(c => c.needGMSupport === 'Yes');
    const withPhoto = countBy(c => c.photoUrl);

    const byDept = {}; DEPARTMENTS.forEach(d => byDept[d] = 0);
    complaints.forEach(c => { byDept[c.department] = (byDept[c.department] || 0) + 1; });
    const maxDept = Math.max(1, ...Object.values(byDept));

    const byStatus = {}; STATUSES.forEach(s => byStatus[s] = 0);
    complaints.forEach(c => { byStatus[c.status] = (byStatus[c.status] || 0) + 1; });
    const maxStatus = Math.max(1, ...Object.values(byStatus));

    return `
      <div class="panel">
        ${connError ? `<div class="row-count" style="color:var(--coral)">${escapeHtml(connError)}</div>` : ''}
        <div class="stat-strip">
          <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div>
          <div class="stat-box solved"><div class="stat-num">${solved}</div><div class="stat-label">Solved</div></div>

          <div class="stat-box gm"><div class="stat-num">${gm}</div><div class="stat-label">GM support</div></div>
        </div>
        ${withPhoto > 0 ? `<div class="row-count">📷 ${withPhoto} complaint${withPhoto === 1 ? '' : 's'} with a photo attached</div>` : ''}
        <div class="chart-grid">
          <div class="chart-col">
            <div class="section-title" data-num="D">By Department</div>
            ${DEPARTMENTS.map(d => `
              <div class="bar-row"><div class="bar-label">${d}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${(byDept[d] / maxDept * 100).toFixed(0)}%"></div></div>
                <div class="bar-val">${byDept[d]}</div></div>
            `).join('')}
          </div>
          <div class="chart-col">
            <div class="section-title" data-num="S">By Status</div>
            ${STATUSES.map(s => `
              <div class="bar-row"><div class="bar-label">${s}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${(byStatus[s] / maxStatus * 100).toFixed(0)}%; background:${
                  s === 'Solved' ? 'var(--sage)' : s === 'In Progress' ? 'var(--amber)' : s === 'Need GM Support' ? 'var(--coral)' : 'var(--slate)'
                }"></div></div>
                <div class="bar-val">${byStatus[s]}</div></div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }

  // ---------- FAB ----------
  function updateFab() {
    let fab = document.getElementById('onz-fab');
    if (activeTab !== 'log') {
      if (fab) fab.remove();
      return;
    }
    if (!fab) {
      fab = document.createElement('button');
      fab.id = 'onz-fab';
      fab.className = 'fab visible';
      fab.title = 'Refresh from Google Sheet';
      fab.textContent = '↻';
      fab.addEventListener('click', doRefresh);
      document.body.appendChild(fab);
    }
  }

  // ---------- SHELL ----------
  function render() {
    if (!loaded) {
      root.innerHTML = `<div class="wrap"><div class="panel" style="text-align:center; color: var(--slate);">Loading…</div></div>`;
      return;
    }
    const tabs = [
      { id: 'form', label: 'New Complaint' },
      { id: 'log', label: 'Log' },
      { id: 'dashboard', label: 'Dashboard' }
    ];
    let panelHtml = '';
    if (activeTab === 'form') panelHtml = renderFormPanel();
    else if (activeTab === 'log') panelHtml = renderLogPanel();
    else panelHtml = renderDashboardPanel();

    const dotClass = !isConfigured() ? 'off' : (connError ? 'off' : 'on');
    const stripText = !isConfigured()
      ? 'Google Sheet URL not configured'
      : (connError ? 'Connection issue — tap ↻ to retry' : 'Synced to Google Sheet');

    root.innerHTML = `
      <div class="wrap">
        <div class="mobile-head">
          <div class="masthead">
            <div>
              <p class="wordmark">Onederz<span>.</span></p>
              <p class="tagline">Guest Complaint &amp; Feedback</p>
            </div>
            <p class="tagline date">${todayISO()}</p>
          </div>
          <div class="conn-strip">
            <div class="conn-dot ${dotClass}"></div>
            <span>${stripText}</span>
          </div>
          <div class="tabs">
            ${tabs.map(t => `<div class="tab ${activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">${t.label}</div>`).join('')}
          </div>
        </div>
        <div id="onz-panel-container">${panelHtml}</div>
      </div>
    `;

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        activeTab = tab.dataset.tab;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    if (activeTab === 'form') wireFormPanel();
    else if (activeTab === 'log') wireLogPanel();
    updateFab();
  }

  // ---------- INIT ----------
  async function init() {
    try { loadFonts(); } catch (e) {}
    render();
    try { await fetchAllComplaints(); } catch (e) { complaints = []; }
    loaded = true;
    render();
  }

  init().catch((err) => {
    console.error('Init failed:', err);
    loaded = true;
    complaints = [];
    render();
  });
})();
</script>
</body>
</html>
